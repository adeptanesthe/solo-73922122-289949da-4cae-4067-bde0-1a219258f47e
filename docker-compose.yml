services:
  mask-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mask-propagation-api:1.0.0
    container_name: mask-propagation-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); sys.exit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
